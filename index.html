<!DOCTYPE html>

<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#1769aa">

  <title>ثبت گفتار تیسا</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      padding: 18px;

      background: #f5f6f8;

      color: #202124;

      font-family: Arial, Tahoma, sans-serif;

      font-size: 16px;

      line-height: 1.8;

    }

    main { max-width: 680px; margin: 0 auto; }

    h1 { font-size: 22px; margin: 0 0 6px; }

    p { margin: 0 0 14px; color: #5f6368; }

    .panel {

      padding: 16px;

      background: white;

      border-radius: 12px;

      box-shadow: 0 1px 4px #00000012;

    }

    textarea, input {

      width: 100%;

      padding: 12px;

      border: 1px solid #c9cdd2;

      border-radius: 8px;

      font: inherit;

    }

    textarea { min-height: 190px; line-height: 1.8; }

    button {

      min-height: 48px;

      padding: 10px 14px;

      margin: 8px 0 0;

      border: 0;

      border-radius: 8px;

      font: inherit;

      font-weight: bold;

      cursor: pointer;

    }

    button:disabled { opacity: .55; cursor: not-allowed; }

    .primary { background: #1769aa; color: white; }

    .danger { background: #b3261e; color: white; }

    .secondary { background: #e8eaed; color: #202124; }

    .actions {

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

    }

    #status {

      padding: 10px;

      margin-top: 12px;

      border-radius: 8px;

      white-space: pre-wrap;

      overflow-wrap: anywhere;

    }

    .info { color: #174ea6; background: #e8f0fe; }

    .success { color: #137333; background: #e6f4ea; }

    .error { color: #b3261e; background: #fce8e6; }

    .small { margin-top: 12px; font-size: 13px; color: #666; }

    label {

      display: block;

      font-weight: bold;

      margin: 16px 0 6px;

    }

  </style>

</head>

<body>

<main>

  <h1>ثبت گفتار تیسا</h1>

  <p>صحبت کن؛ صدایت به سرویس تبدیل گفتار فارسی فرستاده می‌شود و متن در همین صفحه نمایش داده خواهد شد.</p>

  <section class="panel">

    <label for="voiceToken">رمز اختصاصی ثبت صوت</label>

    <input

      id="voiceToken"

      type="password"

      autocomplete="off"

      placeholder="رمز TISSA_VOICE_TOKEN"

    >

    <div class="actions">

      <button id="startBtn" class="primary" type="button">

        🎙 شروع ضبط

      </button>

      <button id="stopBtn" class="danger" type="button" disabled>

        ⏹ پایان ضبط

      </button>

    </div>

    <button id="transcribeBtn" class="primary" type="button" disabled style="width:100%">

      تبدیل صدا به متن فارسی

    </button>

    <label for="transcript">متن تشخیص‌داده‌شده</label>

    <textarea

      id="transcript"

      placeholder="متن تبدیل‌شده اینجا نمایش داده می‌شود؛ می‌توانی آن را اصلاح کنی."

    ></textarea>

    <div class="actions">

      <button id="sendBtn" class="primary" type="button">

        ارسال متن به صفحه تیسا

      </button>

      <button id="copyBtn" class="secondary" type="button">

        کپی متن

      </button>

    </div>

    <div id="status" class="info" role="status" aria-live="polite">

      ابتدا رمز ثبت صوت را وارد کن و سپس شروع ضبط را بزن.

    </div>

    <div class="small">

      فایل صوتی برای تبدیل به متن به سرور تیسا و سپس سرویس 1xAi فرستاده می‌شود.

      متن قبل از ارسال به CRM قابل بازبینی و اصلاح است.

    </div>

  </section>

</main>

<script>

(function () {

  const $ = id => document.getElementById(id);

  const API_URL =
  'https://royal-surf-a674.info-tabiatgostar.workers.dev';


  let mediaRecorder = null;

  let audioStream = null;

  let audioChunks = [];

  let audioBlob = null;

  function status(message, type) {

    $('status').textContent = message;

    $('status').className = type || 'info';

  }

  function getVoiceToken() {

    return $('voiceToken').value.trim();

  }

  function setRecording(on) {

    $('startBtn').disabled = on;

    $('stopBtn').disabled = !on;

    $('transcribeBtn').disabled = on || !audioBlob;

    $('startBtn').textContent =

      on ? '🎙 در حال ضبط...' : '🎙 شروع ضبط';

  }

  function releaseMicrophone() {

    if (audioStream) {

      audioStream.getTracks().forEach(track => track.stop());

      audioStream = null;

    }

  }

  $('startBtn').addEventListener('click', async function () {

    if (!getVoiceToken()) {

      status('ابتدا رمز اختصاصی ثبت صوت را وارد کن.', 'error');

      $('voiceToken').focus();

      return;

    }

    if (!navigator.mediaDevices ||

        !navigator.mediaDevices.getUserMedia ||

        !window.MediaRecorder) {

      status('این مرورگر امکان ضبط صدا را فراهم نکرده است. صفحه را با Safari و از طریق HTTPS باز کن.', 'error');

      return;

    }

    try {

      status('در حال درخواست اجازه میکروفون...', 'info');

      audioStream = await navigator.mediaDevices.getUserMedia({

        audio: true

      });

      let mimeType = '';

      const supportedTypes = [

        'audio/mp4',

        'audio/webm;codecs=opus',

        'audio/webm'

      ];

      for (const type of supportedTypes) {

        if (MediaRecorder.isTypeSupported(type)) {

          mimeType = type;

          break;

        }

      }

      const options = mimeType ? { mimeType } : {};

      mediaRecorder = new MediaRecorder(audioStream, options);

      audioChunks = [];

      audioBlob = null;

      mediaRecorder.ondataavailable = function (event) {

        if (event.data && event.data.size > 0) {

          audioChunks.push(event.data);

        }

      };

      mediaRecorder.onstop = function () {

        audioBlob = new Blob(audioChunks, {

          type: mediaRecorder.mimeType || mimeType || 'audio/mp4'

        });

        releaseMicrophone();

        setRecording(false);

        $('transcribeBtn').disabled = false;

        status(

          'ضبط پایان یافت. حالا روی «تبدیل صدا به متن فارسی» بزن.',

          'success'

        );

      };

      mediaRecorder.onerror = function () {

        releaseMicrophone();

        setRecording(false);

        status('هنگام ضبط صدا خطایی رخ داد.', 'error');

      };

      mediaRecorder.start();

      setRecording(true);

      status('میکروفون فعال است؛ صحبت کن. بعد از پایان صحبت، دکمه پایان ضبط را بزن.', 'success');

    } catch (err) {

      releaseMicrophone();

      setRecording(false);

      status(

        'دسترسی به میکروفون ممکن نشد: ' +

        (err.message || err),

        'error'

      );

    }

  });

  $('stopBtn').addEventListener('click', function () {

    if (mediaRecorder &&

        mediaRecorder.state !== 'inactive') {

      mediaRecorder.stop();

      status('در حال پایان ضبط...', 'info');

    }

  });

  $('transcribeBtn').addEventListener('click', async function () {

    if (!audioBlob) {

      status('ابتدا یک فایل صوتی ضبط کن.', 'error');

      return;

    }

    if (!getVoiceToken()) {

      status('رمز اختصاصی ثبت صوت وارد نشده است.', 'error');

      return;

    }

    if (audioBlob.size > 20 * 1024 * 1024) {

      status('حجم فایل بیش از 20 مگابایت است. کوتاه‌تر ضبط کن.', 'error');

      return;

    }

    $('transcribeBtn').disabled = true;

    $('startBtn').disabled = true;

    status('در حال ارسال صدا و تبدیل آن به متن فارسی... لطفاً صبر کن.', 'info');

    try {

      const reader = new FileReader();

      const dataUrl = await new Promise((resolve, reject) => {

        reader.onload = () => resolve(reader.result);

        reader.onerror = reject;

        reader.readAsDataURL(audioBlob);

      });

      const response = await fetch(API_URL, {

        method: 'POST',

        headers: {

          'Content-Type': 'text/plain;charset=utf-8'

        },

        body: JSON.stringify({

          eventType: 'VOICE_TRANSCRIBE',

          voiceToken: getVoiceToken(),

          mimeType: audioBlob.type || 'audio/mp4',

          audioBase64: dataUrl

        })

      });

      if (!response.ok) {

        throw new Error('پاسخ سرور: ' + response.status);

      }

      const result = await response.json();

      if (!result.ok) {

        throw new Error(result.error || 'تبدیل صدا ناموفق بود.');

      }

      $('transcript').value = result.text || '';

      status(

        'تبدیل صدا با موفقیت انجام شد. متن را بررسی و در صورت نیاز اصلاح کن.',

        'success'

      );

    } catch (err) {

      status(

        'ارتباط با سرور یا تبدیل صدا ناموفق بود: ' +

        (err.message || err) +

        '\nاگر این خطا مربوط به دسترسی مرورگر باشد، باید روش ارتباط با Web App را اصلاح کنیم.',

        'error'

      );

    } finally {

      $('transcribeBtn').disabled = !audioBlob;

      $('startBtn').disabled = false;

    }

  });

  $('sendBtn').addEventListener('click', function () {

    const text = $('transcript').value.trim();

    if (!text) {

      status('متنی برای ارسال وجود ندارد.', 'error');

      return;

    }

    try {

      if (window.opener && !window.opener.closed) {

        window.opener.postMessage({

          type: 'TISSA_VOICE_TRANSCRIPT',

          text: text

        }, '*');

        status('متن به صفحه بازکننده ارسال شد.', 'success');

      } else {

        status('این صفحه مستقل باز شده است. از دکمه کپی متن استفاده کن و متن را در صفحه تیسا قرار بده.', 'info');

      }

    } catch (err) {

      status('ارسال مستقیم انجام نشد. از کپی متن استفاده کن.', 'error');

    }

  });

  $('copyBtn').addEventListener('click', async function () {

    const text = $('transcript').value.trim();

    if (!text) {

      status('متنی برای کپی وجود ندارد.', 'error');

      return;

    }

    try {

      await navigator.clipboard.writeText(text);

      status('متن کپی شد.', 'success');

    } catch (err) {

      $('transcript').focus();

      $('transcript').select();

      const copied = document.execCommand('copy');

      status(

        copied

          ? 'متن کپی شد.'

          : 'متن انتخاب شد؛ از منوی گوشی گزینه Copy را انتخاب کن.',

        copied ? 'success' : 'info'

      );

    }

  });

  window.addEventListener('beforeunload', releaseMicrophone);

})();

</script>

</body>

</html>
