
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دستیار صوتی تیسا</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:22px;background:#f4f1eb;
  font-family:Tahoma,Arial,sans-serif;color:#29251f;
}
.container{
  max-width:520px;margin:35px auto;background:white;
  padding:25px;border-radius:18px;
  box-shadow:0 5px 25px #00000012;
}
h2{text-align:center;color:#a34b22}
p{line-height:2;text-align:center}
input{
  width:100%;padding:14px;border:1px solid #ccc;
  border-radius:9px;font-size:17px;margin:10px 0;
}
button{
  width:100%;padding:15px;border:0;border-radius:10px;
  background:#a34b22;color:white;font-size:17px;
  margin-top:12px;cursor:pointer;
}
button:disabled{opacity:.5}
#stop{background:#555}
#status{
  margin-top:20px;padding:14px;background:#f3eee8;
  border-radius:10px;text-align:center;line-height:2;
}
#conversation{
  margin-top:18px;white-space:pre-wrap;
  line-height:2;max-height:300px;overflow:auto;
}
.small{font-size:12px;color:#777}
</style>
</head>
<body>
<div class="container">
  <h2>دستیار صوتی تیسا</h2>
  <p>آزمایش مکالمه زنده فارسی با هوش مصنوعی 1xAI</p>

  <label>رمز ورود فرم صوتی:</label>
  <input id="pin" type="password" placeholder="رمز ورود را وارد کنید">

  <button id="start">🎙 شروع مکالمه</button>
  <button id="stop" disabled>⏹ پایان مکالمه</button>

  <div id="status">آماده اتصال</div>
  <div id="conversation"></div>
  <p class="small">این صفحه فقط برای آزمایش مکالمه است و اطلاعاتی در CRM ثبت نمی‌کند.</p>
</div>

<script>
const API_URL =
"https://royal-surf-a674.info-tabiatgostar.workers.dev";

const $ = id => document.getElementById(id);

let socket = null;
let audioContext = null;
let mediaStream = null;
let processor = null;
let source = null;
let connected = false;
let nextPlayTime = 0;
let activeSources = [];

function status(message){
  $("status").textContent = message;
}

function log(message){
  $("conversation").textContent += message + "\n";
  $("conversation").scrollTop =
    $("conversation").scrollHeight;
}

function floatTo16BitPCM(float32){
  const buffer = new ArrayBuffer(float32.length * 2);
  const view = new DataView(buffer);

  for(let i=0;i<float32.length;i++){
    let s = Math.max(-1,Math.min(1,float32[i]));
    view.setInt16(i*2,s<0?s*32768:s*32767,true);
  }
  return buffer;
}

function downsample(buffer,inputRate,outputRate){
  if(inputRate === outputRate) return buffer;

  const ratio = inputRate / outputRate;
  const length = Math.floor(buffer.length / ratio);
  const result = new Float32Array(length);

  for(let i=0;i<length;i++){
    const start = Math.floor(i*ratio);
    const end = Math.floor((i+1)*ratio);
    let sum=0,count=0;

    for(let j=start;j<end && j<buffer.length;j++){
      sum += buffer[j];
      count++;
    }
    result[i] = count ? sum/count : 0;
  }
  return result;
}

function arrayBufferToBase64(buffer){
  const bytes = new Uint8Array(buffer);
  let binary = "";
  const chunk = 0x8000;

  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode(
      ...bytes.subarray(i,i+chunk)
    );
  }
  return btoa(binary);
}

function base64ToInt16(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++){
    bytes[i] = binary.charCodeAt(i);
  }
  return new Int16Array(bytes.buffer);
}

function playAudio(base64){
  if(!audioContext) return;

  const pcm = base64ToInt16(base64);
  const audioBuffer = audioContext.createBuffer(
    1,pcm.length,24000
  );

  const channel = audioBuffer.getChannelData(0);

  for(let i=0;i<pcm.length;i++){
    channel[i] = pcm[i] / 32768;
  }

  const player = audioContext.createBufferSource();
  player.buffer = audioBuffer;
  player.connect(audioContext.destination);

  const startAt = Math.max(
    audioContext.currentTime,
    nextPlayTime
  );

  player.start(startAt);
  nextPlayTime = startAt + audioBuffer.duration;

  activeSources.push(player);
  player.onended = () => {
    activeSources = activeSources.filter(x=>x!==player);
  };
}

function stopPlayback(){
  activeSources.forEach(s=>{
    try{s.stop()}catch(e){}
  });
  activeSources=[];
  if(audioContext){
    nextPlayTime=audioContext.currentTime;
  }
}

async function start(){
  if(connected) return;

  const pin = $("pin").value.trim();
  if(!pin){
    status("لطفاً رمز ورود را وارد کنید.");
    return;
  }

  $("start").disabled=true;
  status("در حال دریافت اجازه میکروفون...");

  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio:{
        channelCount:1,
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true
      }
    });

    audioContext = new (window.AudioContext ||
      window.webkitAudioContext)();

    await audioContext.resume();

    status("در حال دریافت کلید اتصال از 1xAI...");

    const response = await fetch(API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"text/plain;charset=UTF-8"
      },
      body:JSON.stringify({
        eventType:"VOICE_REALTIME_TOKEN",
        pin:pin,
        model:"gpt-realtime-mini"
      })
    });

    const result = await response.json();

    if(!response.ok || !result.ok ||
       !result.client_secret ||
       !result.client_secret.value){
      throw new Error(result.error ||
        "دریافت کلید اتصال ناموفق بود.");
    }

    status("در حال برقراری اتصال زنده...");

    const wsUrl =
      result.url + "?client_secret=" +
      encodeURIComponent(result.client_secret.value);

    socket = new WebSocket(wsUrl);

    socket.onopen = () => {
      connected=true;
      $("stop").disabled=false;
      status("متصل شد؛ صحبت کنید.");

      socket.send(JSON.stringify({
        type:"session.update",
        session:{
          instructions:
            "تو دستیار صوتی فارسی شرکت تیسا هستی. " +
            "فقط به زبان فارسی روان و طبیعی صحبت کن. " +
            "پاسخ‌ها کوتاه، دقیق و محترمانه باشند. " +
            "در این آزمایش فقط مکالمه انجام بده و ادعا نکن " +
            "که سفارشی ثبت یا تغییری در CRM ایجاد کرده‌ای.",
          input_audio_format:"pcm16",
          input_audio_transcription:{
            model:"whisper-1",
            language:"fa"
          },
          turn_detection:{
            type:"server_vad",
            interrupt_response:true
          },
          output_audio_format:"pcm16",
          voice:"alloy"
        }
      }));

      startMicrophoneProcessing();
    };

    socket.onmessage = event => {
      const data = JSON.parse(event.data);

      if(data.type === "error"){
        status("خطای اتصال: " +
          (data.error?.message || "خطای نامشخص"));
        return;
      }

      if(data.type ===
        "conversation.item.input_audio_transcription.completed"){
        log("شما: " + (data.transcript || ""));
      }

      if(data.type === "response.audio_transcript.done"){
        log("دستیار تیسا: " + (data.transcript || ""));
      }

      if(data.type === "response.audio.delta"){
        playAudio(data.delta);
      }

      if(data.type === "input_audio_buffer.speech_started"){
        stopPlayback();
        status("صدای شما دریافت شد...");
      }

      if(data.type === "response.done"){
        status("متصل هستید؛ ادامه دهید.");
      }
    };

    socket.onerror = () => {
      status("خطای ارتباط WebSocket؛ اتصال اینترنت را بررسی کنید.");
    };

    socket.onclose = () => {
      connected=false;
      status("اتصال پایان یافت.");
      $("start").disabled=false;
      $("stop").disabled=true;
    };

  }catch(error){
    status("خطا: " + error.message);
    cleanup();
  }
}

function startMicrophoneProcessing(){
  source = audioContext.createMediaStreamSource(mediaStream);

  processor = audioContext.createScriptProcessor(
    4096,1,1
  );

  processor.onaudioprocess = event => {
    if(!connected || !socket ||
       socket.readyState !== WebSocket.OPEN) return;

    const input = event.inputBuffer.getChannelData(0);

    const downsampled = downsample(
      input,audioContext.sampleRate,24000
    );

    const pcm = floatTo16BitPCM(downsampled);

    socket.send(JSON.stringify({
      type:"input_audio_buffer.append",
      audio:arrayBufferToBase64(pcm)
    }));
  };

  source.connect(processor);
  processor.connect(audioContext.destination);
}

function cleanup(){
  connected=false;

  if(processor){
    processor.disconnect();
    processor=null;
  }

  if(source){
    source.disconnect();
    source=null;
  }

  if(mediaStream){
    mediaStream.getTracks().forEach(track=>track.stop());
    mediaStream=null;
  }

  if(socket){
    try{socket.close()}catch(e){}
    socket=null;
  }

  if(audioContext){
    audioContext.close().catch(()=>{});
    audioContext=null;
  }

  $("start").disabled=false;
  $("stop").disabled=true;
}

$("start").addEventListener("click",start);

$("stop").addEventListener("click",()=>{
  cleanup();
  status("مکالمه پایان یافت.");
});
</script>
</body>
</html>
